# # Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# # More GitHub Actions for Azure: https://github.com/Azure/actions
# # More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions         

name: Build and deploy Python app to Azure Functions - emlabai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
 
      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: emalabai.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./build/Dockerfile
          push: true
          tags: emalabai.azurecr.io/app:${{ github.sha }}      

      - name: Zip folder  
        run: |
          cd ./server/src
          zip -r functionapp.zip . -x "*.git*" "*__pycache__*" "*deploy.sh*" ".venv/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v2
        with:
          name: release-artifiacts
          path: functionapp.zip
    

  deploy-app:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        id: login
        with:
          login-server: emalabai.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: azure/webapps-deploy@v2
        with:
          app-name: 'emlabai'
          images: 'emalabai.azurecr.io/app:${{ github.sha }}'

  deploy-functions:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
    permissions:
      id-token: write 

    steps:   
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download artifacts
        uses: actions/download-artifact@v2
        with:
          name: release-artifiacts
      - name: Deploy to Azure Functions
        run: |
          ls           
          az functionapp deployment source config-zip \
              --resource-group DevDashAI_group \
              --name emlabevents \
              --src ./functionapp.zip \
              --build-remote true